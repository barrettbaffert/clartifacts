<body>
<div id="root" class="root"></div>
<script>
'use strict';
/* ============================================================
   WHEEL TRAINER — our 1-3-1 wheel (as Coach described it, Sept 2026)
   Court: half court, viewBox 0 0 500 470, 10 units = 1 ft. Hoop at the TOP (the view a player has
   dribbling up the floor). Left/right = the player's left/right facing the hoop.
   NFHS markings: 12 ft lane, FT line 19 ft from baseline, 3-pt arc 19'9" from rim centre.
   ============================================================ */
const S = {
  START: [250, 445], TOP: [250, 290], LW: [85, 200], RW: [415, 200], LC: [32, 42], RC: [468, 42],
  LE: [178, 200], RE: [322, 200], LB: [168, 82], RB: [332, 82], RIM: [250, 52], BACK: [250, 440]
};
const R = { great: 45, good: 85 };
const SIDE = { L: "left", R: "right" }, OPP = { L: "R", R: "L" };
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
const ease = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const inLane = (p) => p[0] > 190 && p[0] < 310 && p[1] < 190;
const mirror = (p) => [500 - p[0], p[1]];
const REDUCE = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const SPOTS = {
  1: { name: "Point guard", where: "Top", kind: "perim", desc: "Brings it up, passes to a wing, cuts to that corner." },
  2: { name: "Right wing", where: "Right wing", kind: "perim", desc: "Catches, looks inside, dribbles to the top, cuts, lifts." },
  3: { name: "Left wing", where: "Left wing", kind: "perim", desc: "Catches, looks inside, dribbles to the top, cuts, lifts." },
  4: { name: "Elbow post", where: "Left elbow", kind: "post", desc: "Slides down to the block, then flashes back up. Posts swap high and low." },
  5: { name: "Block post", where: "Right block", kind: "post", desc: "Flashes to the elbow, then goes back to the low post. Posts swap high and low." }
};

/* ---------- storage ---------- */
const KEY = "wheel-trainer-v1";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
const store = Object.assign({ spot: 5, stars: {}, done: {} }, load());
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function setStars(id, n) { store.stars[id] = Math.max(store.stars[id] || 0, n); save(); }

/* ---------- tiny DOM helpers ---------- */
const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function h(tag, attrs, ...kids) {

    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);

const root = document.getElementById("root");

/* ---------- animation bookkeeping (cancel everything on screen change) ---------- */
let running = [];
function tween(ms, fn, done) {
  if (REDUCE) ms = Math.min(ms, 120);
  const t0 = performance.now(); let id, alive = true;
  const step = (now) => { if (!alive) return; const k = Math.min(1, (now - t0) / ms); fn(k); if (k < 1) id = requestAnimationFrame(step); else if (done) done(); };

}

function stopAll() { running.forEach((r) => r.cancel()); running = []; document.querySelectorAll(".sheet, .modalBack").forEach((n) => n.remove()); }

/* ---------- court view ---------- */
function courtView() {
  const wrap = h("div", { class: "courtWrap" });
  const svg = sv("svg", { viewBox: "0 0 500 470", role: "img", "aria-label": "Half court, hoop at the top" }, wrap);
  sv("rect", { x: 0, y: 0, width: 500, height: 470, fill: "var(--floor)" }, svg);
  const zones = sv("g", {}, svg);
  const L = { fill: "none", stroke: "var(--cline)", "stroke-width": 3 };
  sv("rect", { x: 190, y: 0, width: 120, height: 190, fill: "var(--paint)", stroke: "var(--cline)", "stroke-width": 3 }, svg);
  sv("path", { d: "M190 190 A60 60 0 0 0 310 190", ...L }, svg);
  sv("path", { d: "M190 190 A60 60 0 0 1 310 190", ...L, "stroke-dasharray": "9 9" }, svg);
  sv("path", { d: "M52.5 0 L52.5 52.5 A197.5 197.5 0 0 0 447.5 52.5 L447.5 0", ...L }, svg);
  sv("path", { d: "M190 470 A60 60 0 0 1 310 470", ...L }, svg);
  sv("rect", { x: 178, y: 70, width: 12, height: 10, fill: "var(--cline)" }, svg);
  sv("rect", { x: 310, y: 70, width: 12, height: 10, fill: "var(--cline)" }, svg);
  sv("line", { x1: 220, y1: 40, x2: 280, y2: 40, stroke: "var(--cline)", "stroke-width": 5 }, svg);
  sv("circle", { cx: 250, cy: 52.5, r: 9, fill: "none", stroke: "var(--rim)", "stroke-width": 4 }, svg);
  sv("rect", { x: 1.5, y: 1.5, width: 497, height: 467, ...L }, svg);
  const labels = sv("g", {}, svg), trails = sv("g", {}, svg), arrows = sv("g", {}, svg), marks = sv("g", {}, svg);
  const defsG = sv("g", {}, svg), playersG = sv("g", {}, svg), ballG = sv("g", {}, svg), ui = sv("g", {}, svg);
  const pl = {}, df = [];
  let ballDot = null;

  function player(id) {
    if (pl[id]) return pl[id];
    const g = sv("g", {}, playersG);
    const ring = sv("circle", { r: 26, fill: "none", stroke: "var(--you)", "stroke-width": 3, class: "pulse", visibility: "hidden" }, g);
    const c = sv("circle", { r: 18, "stroke-width": 3, stroke: "#0A1420" }, g);
    const t = sv("text", { y: 6.5, "text-anchor": "middle", "font-size": 19, "font-weight": 800, "font-family": "Nunito, sans-serif", fill: "#0A1420" }, g);
    t.textContent = id;
    return (pl[id] = { g, c, ring });
  }
  const api = {
    wrap, svg, zones, labels, trails, arrows, marks, ui,
    setPlayers(map, you, opts) {
      opts = opts || {};
      for (const id in pl) if (!(id in map)) { pl[id].g.remove(); delete pl[id]; }
      for (const id in map) {
        const p = player(id), [x, y] = map[id];
        p.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
        const me = String(id) === String(you);
        p.c.setAttribute("fill", me ? "var(--you)" : "var(--team)");
        p.g.setAttribute("opacity", opts.dimOthers && !me ? 0.45 : 1);
        p.ring.setAttribute("visibility", me && opts.ring ? "visible" : "hidden");
      }
    },
    setDefs(list) {
      while (df.length > list.length) df.pop().remove();
      list.forEach((p, i) => {
        if (!df[i]) { const g = sv("g", {}, defsG); sv("path", { d: "M-10 -10 L10 10 M10 -10 L-10 10", stroke: "var(--opp)", "stroke-width": 5, "stroke-linecap": "round" }, g); df[i] = g; }
        df[i].setAttribute("transform", `translate(${p[0].toFixed(1)} ${p[1].toFixed(1)})`);
      });
    },
    setBall(p, held) {
      if (!p) { if (ballDot) { ballDot.remove(); ballDot = null; } return; }
      if (!ballDot) { ballDot = sv("circle", { r: 9, fill: "var(--ball)", stroke: "#5A2A00", "stroke-width": 2 }, ballG); }
      const q = held ? [p[0] + 15, p[1] - 15] : p;
      ballDot.setAttribute("cx", q[0].toFixed(1)); ballDot.setAttribute("cy", q[1].toFixed(1));
    },
    clear(layer) { while (layer.firstChild) layer.firstChild.remove(); },
    toCourt(evt) {
      const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
      const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return [r.x, r.y];
    }
  };
  return api;
}

function arrow(layer, pts, kind) {
  const col = { cut: "var(--text)", you: "var(--you)", pass: "var(--ball)", fix: "var(--great)", look: "var(--dim)", back: "var(--opp)" }[kind] || "var(--text)";
  const dash = kind === "pass" ? "10 8" : kind === "look" ? "3 7" : "0";
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const end = [b[0] - ux * 24, b[1] - uy * 24];
  const first = pts[0], nx = pts[1][0] - first[0], ny = pts[1][1] - first[1], nd = Math.hypot(nx, ny) || 1;
  const start = [first[0] + nx / nd * 22, first[1] + ny / nd * 22];
  const mid = pts.slice(1, -1);
  const dStr = "M" + [start, ...mid, end].map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  sv("path", { d: dStr, fill: "none", stroke: col, "stroke-width": 4, "stroke-dasharray": dash, "stroke-linecap": "round", "stroke-linejoin": "round" }, layer);
  if (kind !== "look") sv("path", { d: `M${end[0] + ux * 13} ${end[1] + uy * 13} L${end[0] - uy * 9} ${end[1] + ux * 9} L${end[0] + uy * 9} ${end[1] - ux * 9}Z`, fill: col }, layer);
}
function courtLabel(layer, p, text, col) {
  const t = sv("text", { x: p[0], y: p[1], "text-anchor": "middle", "font-size": 22, "font-weight": 800, "font-family": "'Barlow Condensed', sans-serif",
    "letter-spacing": 1, fill: col || "var(--accent)", stroke: "#0B1524", "stroke-width": 5, "paint-order": "stroke" }, layer);
  t.textContent = text; return t;
}
function spotRing(layer, p, col) { sv("circle", { cx: p[0], cy: p[1], r: 26, fill: "none", stroke: col || "var(--great)", "stroke-width": 4, "stroke-dasharray": "6 5" }, layer); }
function tapMark(layer, p, col) { sv("path", { d: `M${p[0] - 11} ${p[1] - 11} L${p[0] + 11} ${p[1] + 11} M${p[0] + 11} ${p[1] - 11} L${p[0] - 11} ${p[1] + 11}`, stroke: col, "stroke-width": 5, "stroke-linecap": "round" }, layer); sv("circle", { cx: p[0], cy: p[1], r: 17, fill: "none", stroke: col, "stroke-width": 3 }, layer); }
function zoneLane(layer) { sv("rect", { x: 190, y: 0, width: 120, height: 190, fill: "rgba(242,249,79,0.22)" }, layer); }

/* ============================================================
   THE WHEEL ENGINE — builds a possession as a list of beats.
   Coach: 1 passes to a wing and cuts to that corner; 4 slides to the block and 5 comes up to the elbow
   (overload). No shot: the wing dribbles to the top and it repeats the other way; posts swap high/low.
   Our fill-ins (flagged for parents): the far-corner player lifts to the wing when the ball goes to the top;
   posts wait for the pass to the wing.
   Each beat: moves {id: [x,y]}, optional pass [from,to] or carrier id, and dec {id: decision} for anyone
   who has a job at that moment. Decision targets are where that player should end up.
   ============================================================ */
function buildPossession(start, cycles) {
  const pos = { 1: S.START, 2: S.RW, 3: S.LW, 4: S.LE, 5: S.RB };
  const at = { top: 1, LW: 3, RW: 2, LC: 0, RC: 0, elbow: 4, block: 5 };
  let ball = 1; const beats = [];
  const push = (b) => {
    b.from = Object.assign({}, pos); b.ballFrom = ball; b.moves = b.moves || {}; b.dec = b.dec || {};
    for (const k in b.moves) pos[k] = b.moves[k];
    if (b.pass) ball = b.pass[1];
    b.to = Object.assign({}, pos); b.ballTo = ball; beats.push(b);
  };
  push({ type: "setup", cap: "Set up: #1 has the ball, wings wide, #4 on the left elbow, #5 on the right block.", ms: 1000 });
  push({ type: "dribbleUp", cap: "#1 brings it up the middle.", moves: { 1: S.TOP }, carrier: 1, ms: 1300 });
  let sd = start;
  for (let i = 0; i < cycles; i++) {
    const o = OPP[sd], top = at.top, wing = at[sd + "W"], el = at.elbow, bl = at.block;
    push({ type: "pass", cap: `#${top} passes to the ${SIDE[sd]} wing.`, pass: [top, wing], ms: 650,
      dec: { [top]: { kind: i === 0 ? "passFirst" : "passWing", targets: i === 0 ? [S.LW, S.RW] : [S[sd + "W"]], side: sd } } });
    const dec = {
      [top]: { kind: "cutCorner", targets: [S[sd + "C"]], side: sd },
      [el]: { kind: "goLow", targets: [S[sd + "B"]], side: sd, cross: (pos[el][0] < 250) !== (sd === "L") },
      [bl]: { kind: "flash", targets: [S[sd + "E"]], side: sd, cross: (pos[bl][0] < 250) !== (sd === "L") }
    };
    if (at[o + "W"]) dec[at[o + "W"]] = { kind: "holdWing", targets: [pos[at[o + "W"]]], side: sd };
    if (at[o + "C"]) dec[at[o + "C"]] = { kind: "holdCornerWeak", targets: [pos[at[o + "C"]]], side: sd };
    push({ type: "afterPass", cap: `#${top} cuts to the ${SIDE[sd]} corner. #${el} slides down to the block, #${bl} flashes up to the elbow.`,
      sub: "Four of us on the ball's side: that's the overload.", moves: { [top]: S[sd + "C"], [el]: S[sd + "B"], [bl]: S[sd + "E"] }, ms: 1400, dec });
    at[sd + "C"] = top; at.top = 0; at.elbow = bl; at.block = el;
    if (i === cycles - 1) { push({ type: "end", cap: `#${wing} looks for a shot or a pass inside.`, sub: "Keep turning the wheel until someone is open.", ms: 1400 }); break; }
    push({ type: "look", cap: `#${wing} looks inside… no shot.`, ms: 800 });
    const lift = at[o + "C"];
    const mv = { [wing]: S.TOP }; if (lift) mv[lift] = S[o + "W"];
    const dec2 = {
      [wing]: { kind: "dribbleTop", targets: [S.TOP], side: sd },
      [at.elbow]: { kind: "holdPost", targets: [pos[at.elbow]] },
      [at.block]: { kind: "holdPost", targets: [pos[at.block]] },
      [at[sd + "C"]]: { kind: "holdCorner", targets: [pos[at[sd + "C"]]] }
    };
    if (lift) dec2[lift] = { kind: "liftWing", targets: [S[o + "W"]], side: o };
    if (at[o + "W"]) dec2[at[o + "W"]] = { kind: "holdWing2", targets: [pos[at[o + "W"]]] };
    push({ type: "dribbleTop", cap: `#${wing} dribbles it back to the top.` + (lift ? ` #${lift} lifts from the corner to the ${SIDE[o]} wing.` : ""),
      moves: mv, carrier: wing, ms: 1500, dec: dec2 });
    at.top = wing; at[sd + "W"] = 0; if (lift) { at[o + "W"] = lift; at[o + "C"] = 0; }
    push({ type: "swing", cap: "Now run it to the other side.", ms: 600 });
    sd = o;
  }
  return beats;
}

const GRADE = { great: { label: "GREAT", col: "var(--great)" }, good: { label: "CLOSE", col: "var(--good)" }, risky: { label: "NOT QUITE", col: "var(--risky)" } };

function gradeTap(p, targets, opts) {
  opts = opts || {};
  let best = Infinity, target = targets[0];
  for (const t of targets) { const d = dist(p, t); if (d < best) { best = d; target = t; } }
  let g = best <= R.great ? "great" : best <= R.good ? "good" : "risky";
  if (opts.zone === "back") { g = p[1] >= 370 ? "great" : p[1] >= 300 ? "good" : "risky"; target = [Math.min(440, Math.max(60, p[0])), 430]; }
  if (opts.zone === "outLane") { g = !inLane(p) && best <= 110 ? "great" : !inLane(p) ? "good" : "risky"; }
  if (opts.zone === "lane") { g = inLane(p) ? "great" : "risky"; }
  const notes = [];
  if (g !== "great") {
    if (inLane(p) && !targets.some(inLane) && opts.zone !== "lane") notes.push("That spot is in the lane. When we have the ball you can only stay there 3 seconds.");
    if (opts.others) for (const id in opts.others) { if (dist(p, opts.others[id]) < 40) { notes.push(`That's where ${id} is. Two players in one spot are easy to guard.`); break; } }
    if (opts.hold && best > R.good) notes.push("Too early! This time you wait.");
  }
  return { g, best, target, notes };
}

function starsFor(results) {
  if (!results.length) return 1;
  const score = results.reduce((a, r) => a + (r.g === "great" ? 1 : r.g === "good" ? 0.5 : 0), 0) / results.length;
  return score >= 0.9 ? 3 : score >= 0.6 ? 2 : 1;
}

function drawDiagram(view, d, you) {
  if (!d) return null;
  view.clear(view.zones); view.clear(view.labels); view.clear(view.arrows);
  if (d.zone === "lane") zoneLane(view.zones);
  if (d.zone === "sides") { sv("rect", { x: 0, y: 0, width: 250, height: 470, fill: "rgba(242,249,79,0.10)" }, view.zones); sv("line", { x1: 250, y1: 0, x2: 250, y2: 470, stroke: "var(--accent)", "stroke-width": 2, "stroke-dasharray": "6 8" }, view.zones); }
  if (d.extra === "ftline") sv("line", { x1: 0, y1: 200, x2: 500, y2: 200, stroke: "var(--accent)", "stroke-width": 2, "stroke-dasharray": "6 8" }, view.zones);
  (d.labels || []).forEach(([p, t, c]) => courtLabel(view.labels, p, t, c));
  const players = Object.assign({}, d.players || {});
  const me = d.you != null ? d.you : null;
  (d.arrows || []).forEach(([pts, kind]) => arrow(view.arrows, pts, kind));
  for (const id in d.moves || {}) arrow(view.arrows, [players[id], d.moves[id]], String(id) === String(me) ? "you" : "cut");
  for (const id in d.path || {}) arrow(view.arrows, d.path[id], String(id) === String(me) ? "you" : "cut");
  view.setDefs(d.defs || []);
  const ballAt = (map) => d.ball == null ? null : Array.isArray(d.ball) ? d.ball : map[d.ball];
  const place = (map) => { view.setPlayers(map, me); const b = ballAt(map); view.setBall(b, !!b && !Array.isArray(d.ball)); };
  place(players);
  const hasMotion = Object.keys(d.moves || {}).length || Object.keys(d.path || {}).length;
  if (!hasMotion) return;
  const loop = () => {
    tween(1300, (k) => {
      const e = ease(k), m = Object.assign({}, players);
      for (const id in d.moves || {}) m[id] = lerp(players[id], d.moves[id], e);
      for (const id in d.path || {}) { const pts = d.path[id], seg = pts.length - 1, f = Math.min(seg - 1e-6, e * seg), i = Math.floor(f); m[id] = lerp(pts[i], pts[i + 1], f - i); }
      place(m);
    }, () => later(1200, () => { place(players); later(500, loop); }));
  };
  later(500, loop);
}

function runLesson(id) {

  let sx = null;
  col.addEventListener("touchstart", (e) => { if (!e.target.closest("svg")) sx = e.touches[0].clientX; }, { passive: true });

  render();
}

  };

/* ---------- Watch the Wheel ---------- */
function runWatch() {
  store.done.watch = 1; save();
  let follow = store.spot, playing = true, speed = 1, beats, idx, elapsed, last = 0, cur, holder, trail;
  const view = courtView(), cap = h("p", { class: "caption" });
  const chips = h("div", { class: "ctrlRow" }, h("span", { class: "hint" }, "Follow:"),
    [1, 2, 3, 4, 5].map((n) => h("button", { class: "chipBtn" + (n === follow ? " on" : ""), "aria-label": "Follow player " + n, onclick: (e) => { follow = n; chips.querySelectorAll(".chipBtn").forEach((b) => b.classList.toggle("on", b === e.currentTarget)); reset(); } }, String(n))));
  const playBtn = h("button", { class: "btn ghost", onclick: () => { playing = !playing; playBtn.textContent = playing ? "⏸ Pause" : "▶ Play"; } }, "⏸ Pause");
  const slowBtn = h("button", { class: "btn ghost", onclick: () => { speed = speed === 1 ? 0.55 : 1; slowBtn.textContent = speed === 1 ? "🐢 Slower" : "🐇 Normal"; } }, "🐢 Slower");
  root.replaceChildren(h("div", { class: "col narrow" }, topBar("Watch the Wheel"), cap, view.wrap, chips,
    h("div", { class: "ctrlRow" }, playBtn, h("button", { class: "btn ghost", onclick: () => reset() }, "↺ Restart"), slowBtn)));
  if (REDUCE) { playing = false; playBtn.textContent = "▶ Play"; }
  function reset() { beats = buildPossession("L", 6); idx = 0; cur = Object.assign({}, beats[0].from); holder = 1; trail = []; view.clear(view.trails); start(); }
  function start() {
    const b = beats[idx]; elapsed = 0;
    cap.innerHTML = fmtCap(b.cap, follow) + (b.sub ? `<small>${b.sub}</small>` : "");
    if (b.moves[follow]) { trail.push([b.from[follow], b.moves[follow]]); if (trail.length > 3) trail.shift(); }
    view.clear(view.trails); trail.forEach(([a, c], j) => sv("line", { x1: a[0], y1: a[1], x2: c[0], y2: c[1], stroke: "var(--you)", "stroke-width": 3, "stroke-dasharray": "6 7", opacity: 0.3 + 0.2 * j }, view.trails));
  }
  function frame(now) {
    if (!alive) return; requestAnimationFrame(frame);
    const dt = last ? Math.min(100, now - last) : 0; last = now; if (playing) elapsed += dt * speed;
    const b = beats[idx], dur = b.ms, e = ease(Math.min(1, elapsed / dur));
    for (const id in b.moves) cur[id] = lerp(b.from[id], b.moves[id], e);
    view.setPlayers(cur, follow, { dimOthers: false });
    if (b.pass) view.setBall(lerp(b.from[b.pass[0]], b.from[b.pass[1]], e), e >= 1); else view.setBall(cur[b.carrier || holder], true);
    if (elapsed > dur + 900) { if (b.pass) holder = b.pass[1]; idx++; if (idx >= beats.length) { reset(); return; } start(); }
  }
  let alive = true; running.push({ cancel() { alive = false; } });
  reset(); requestAnimationFrame(frame);
}

/* ---------- beat player shared by Run the Wheel ---------- */
function playBeat(view, b, you, done) {
  tween(b.ms, (k) => {
    const e = ease(k), m = {};
    for (const id in b.from) m[id] = b.moves[id] ? lerp(b.from[id], b.moves[id], e) : b.from[id];
    view.setPlayers(m, you);
    if (b.pass) view.setBall(lerp(b.from[b.pass[0]], b.from[b.pass[1]], e), k >= 1);
    else view.setBall(m[b.carrier || b.ballFrom], true);
  }, () => later(380, done));
}

/* ---------- Run the Wheel ---------- */
function runPattern() {
  const you = store.spot;
  let side = Math.random() < 0.5 ? "L" : "R", beats = buildPossession(side, 5), i = 0, holds = 0;
  const asked = {}, results = [];
  const view = courtView(), cap = h("p", { class: "caption" }), promptEl = h("div", { class: "hint" }, "Watch the play…"), meta = h("span", { class: "meta" });
  root.replaceChildren(h("div", { class: "col narrow" }, topBar("Run the Wheel", meta), cap, view.wrap, h("div", { class: "ctrlRow" }, promptEl)));
  view.setPlayers(beats[0].from, you); view.setBall(beats[0].from[1], true);
  const setMeta = () => { meta.textContent = `You are #${you} · ${results.length} move${results.length === 1 ? "" : "s"}`; };
  setMeta();
  const shouldAsk = (d) => { if (!HOLD[d.kind]) return true; const c = HOLD[d.kind]; if (asked[c] || holds >= 2) return false; asked[c] = 1; holds++; return true; };
  function next() {
    if (i >= beats.length) { const n = showResults("Possession over!", results, () => go("run")); setStars("run:" + you, n); return; }
    const b = beats[i], d = b.dec[you];
    cap.innerHTML = fmtCap(b.cap, you) + (b.sub ? `<small>${b.sub}</small>` : "");
    if (d && shouldAsk(d)) return ask(b, d);
    promptEl.className = "hint"; promptEl.textContent = "Watch the play…";
    playBeat(view, b, you, () => { i++; next(); });
  }
  function ask(b, d) {
    cap.innerHTML = b.type === "pass" ? "" : fmtCap(beats[i - 1] ? beats[i - 1].cap : "", you);
    const pr = PROMPT[d.kind]; promptEl.className = "prompt"; promptEl.textContent = typeof pr === "function" ? pr(d) : pr;
    view.setPlayers(b.from, you, { ring: true }); view.wrap.classList.add("tapping");
    const onTap = (e) => {
      view.svg.removeEventListener("pointerdown", onTap); view.wrap.classList.remove("tapping");
      const p = view.toCourt(e);
      const others = {}; for (const id in b.to) if (+id !== you) others[id] = b.to[id];
      const r = gradeTap(p, d.targets, { others, hold: !!HOLD[d.kind] });
      if (d.kind === "passFirst") {
        const chosen = r.target === S.RW ? "R" : "L";
        if (chosen !== side) { side = chosen; beats = buildPossession(side, 5); b = beats[i]; d = b.dec[you]; }
      }
      results.push(r); setMeta();
      tapMark(view.marks, p, GRADE[r.g].col);
      const fb = FB[d.kind](d);
      promptEl.className = "hint"; promptEl.textContent = "";
      cap.innerHTML = fmtCap(b.cap, you) + (b.sub ? `<small>${b.sub}</small>` : "");
      playBeat(view, b, you, () => {
        const final = b.pass ? b.to[b.pass[1]] : b.to[you];
        spotRing(view.marks, final);
        if (r.g !== "great" && dist(p, final) > 30) arrow(view.marks, [p, final], "fix");
        openSheet(r, fb, [{ label: "Keep going →", primary: true, fn: () => { view.clear(view.marks); i++; next(); } }]);
      });
    };
    view.svg.addEventListener("pointerdown", onTap);
  }
  later(300, next);
}

    { title: "Steal!", you: S.LC, mates: [["perim", S.LW], ["perim", S.TOP], ["post", S.LB], ["post", S.LE]], ball: 1,

      fb: { title: "Sprint back!", why: "When the other team steals it, run back toward our basket as fast as you can. Stop the easy layup first, then find a player to guard.", kid: "Turnover? Sprint back." } }
  ]
};
const defAuto = (p) => lerp(p, S.RIM, Math.min(0.55, 42 / (dist(p, S.RIM) || 1)));

function runReads() {
  const you = store.spot, kind = SPOTS[you].kind, list = READS[kind];
  const posts = [4, 5].filter((n) => n !== you), perims = [1, 2, 3].filter((n) => n !== you);
  let i = 0; const results = [];
  const view = courtView(), cap = h("p", { class: "caption" }), promptEl = h("div", { class: "prompt" }), meta = h("span", { class: "meta" });
  root.replaceChildren(h("div", { class: "col narrow" }, topBar("When It Breaks", meta), cap, view.wrap, h("div", { class: "ctrlRow" }, promptEl)));
  function scene() {
    stopAll(); view.clear(view.marks); view.clear(view.zones);
    if (i >= list.length) { const n = showResults("All reads done!", results, () => go("reads")); setStars("reads:" + you, n); return; }
    const sc = list[i], M = i % 2 ? mirror : (p) => p;
    meta.textContent = `${i + 1} of ${list.length} · you are #${you}`;
    cap.innerHTML = `<b class="me">${sc.title}</b><small>${kind === "post" ? "You're a post in our overload." : "You're an outside player."}</small>`;
    const pc = posts.slice(), qc = perims.slice(), ids = [];
    const pos = { [you]: M(sc.you) }, defs = [M(sc.youDef || defAuto(sc.you))];
    sc.mates.forEach(([k, p, dp]) => { const id = k === "post" ? pc.shift() : qc.shift(); ids.push(id); pos[id] = M(p); defs.push(M(dp || defAuto(p))); });
    const holderId = sc.ball === "you" ? you : ids[sc.ball];
    view.setPlayers(pos, you); view.setDefs(defs); view.setBall(pos[holderId], true);
    promptEl.className = "hint"; promptEl.textContent = "Watch…";
    const L = sc.lead || {}; let ballAt = pos[holderId], holder = holderId;
    const lead = (done) => {
      if (L.shot) return tween(900, (k) => { const q = lerp(pos[holder], S.RIM, ease(k)); q[1] -= Math.sin(k * Math.PI) * 60; view.setBall(q, false); }, () => { ballAt = [250, 52]; done(); });
      if (L.passTo === "you") return tween(650, (k) => view.setBall(lerp(pos[holder], pos[you], ease(k)), k >= 1), () => { holder = you; done(); });
      if (L.steal != null) { const di = L.steal + 1; return tween(650, (k) => view.setBall(lerp(pos[holder], defs[di], ease(k)), false), () => { holder = null; ballAt = defs[di]; done(); }); }
      if (L.mateMoves) {
        const from = Object.assign({}, pos), tgt = {}; for (const mi in L.mateMoves) tgt[ids[mi]] = M(L.mateMoves[mi]);
        return tween(1000, (k) => { const e = ease(k); for (const id in tgt) pos[id] = lerp(from[id], tgt[id], e); view.setPlayers(pos, you); view.setBall(pos[holder], true); }, done);
      }
      later(400, done);
    };
    later(700, () => lead(() => {
      promptEl.className = "prompt"; promptEl.textContent = sc.prompt;
      view.setPlayers(pos, you, { ring: true }); view.wrap.classList.add("tapping");
      const targets = sc.targetMate != null ? [pos[ids[sc.targetMate]]] : sc.targets.map(M);
      const onTap = (e) => {
        view.svg.removeEventListener("pointerdown", onTap); view.wrap.classList.remove("tapping"); view.setPlayers(pos, you);
        const p = view.toCourt(e), others = {}; ids.forEach((id) => others[id] = pos[id]);
        if (sc.targetMate != null) delete others[ids[sc.targetMate]];
        const r = gradeTap(p, targets, { zone: sc.zone, others, hold: sc.hold }); results.push(r);
        tapMark(view.marks, p, GRADE[r.g].col);
        const finish = () => {
          if (sc.zone === "outLane") zoneLane(view.zones);
          spotRing(view.marks, r.target);
          if (r.g !== "great" && dist(p, r.target) > 30) arrow(view.marks, [p, r.target], "fix");
          const again = () => { scene(); };
          openSheet(r, sc.fb, [{ label: i === list.length - 1 ? "Finish" : "Next →", primary: true, fn: () => { i++; scene(); } }, { label: "Try again", fn: () => { results.pop(); again(); } }]);
        };
        if (sc.targetMate != null) { tween(650, (k) => view.setBall(lerp(pos[you], targets[0], ease(k)), k >= 1), finish); return; }
        const fromP = pos[you], to = sc.zone === "back" ? r.target : r.g === "great" && sc.zone === "outLane" ? p : r.target;
        tween(900, (k) => { pos[you] = lerp(fromP, to, ease(k)); view.setPlayers(pos, you); if (holder === you) view.setBall(pos[you], true); }, () => {
          if (sc.after && sc.after.passFrom != null) tween(650, (k) => view.setBall(lerp(pos[ids[sc.after.passFrom]], pos[you], ease(k)), k >= 1), finish);
          else finish();
        });
      };
      view.svg.addEventListener("pointerdown", onTap);
    }));
  }
  scene();
}

/* ---------- boot ---------- */
try { go("home"); }
catch (err) { root.replaceChildren(h("pre", { style: "color:#fff;white-space:pre-wrap" }, String(err && err.stack || err))); }
</script>
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }</script>
