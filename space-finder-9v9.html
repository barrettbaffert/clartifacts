<div id="root" class="root"></div>
<script>
/* ============================================================
   SPACE FINDER 9v9 — engine
   Coordinates: pitch units, viewBox 0 0 100 64. Our goal is on the LEFT (x≈3), we attack to the RIGHT.
   Screen-down is OUR RIGHT side: RB lives at high y (~54), LB at low y (~10).
   Opponents attack toward our goal; THEIR left side is OUR right side (high y).
   Play tracks are keyframes [[ms, x, y], ...]. Outcome tracks are [[t01, x, y], ...] over outcome.dur.
   ============================================================ */
'use strict';
const T = { night:"#0B1524", panel:"#101F33", panelEdge:"#1D3450", turfA:"#1F6B45", turfB:"#1A5C3B", chalk:"#E8F2E9",
  you:"#53D8FF", mate:"#8FD3F2", opp:"#FF6E5E", tele:"#F2F94F", great:"#43D97B", good:"#F5C542", risky:"#FF9C5B",
  slow:"#9AA7B8", ink:"#0A1420", text:"#EAF2FA", dim:"#9FB2C8", gkRing:"#FFD166" };
const RATINGS = { great:{label:"GREAT CHOICE", color:T.great, stars:true}, good:{label:"GOOD CHOICE", color:T.good},
  risky:{label:"RISKY CHOICE", color:T.risky}, slow:{label:"TOO SLOW", color:T.slow} };
const DECIDE_MS = 10000;
const STORAGE_KEY = "sf9v9-progress";
const OUR_IDS = ["GK","RB","RCB","LCB","LB","RCM","CM","LCM","ST"];
const THEIR_IDS = ["oGK","oR","oC","oL","oRM","oCM","oLM","oRF","oCF","oLF"];
const PLAYABLE = ["RB","LB","RCB","LCB","LCM","CM","RCM"];
const OFFENSIVE = { "build-attack":1, "transition-to-attack":1, "patterns":1 };
const ROLE_MIRROR = { RB:"LB", LB:"RB", RCB:"LCB", LCB:"RCB", RCM:"LCM", LCM:"RCM", CM:"CM", GK:"GK", ST:"ST",
  oGK:"oGK", oR:"oL", oL:"oR", oC:"oC", oRM:"oLM", oLM:"oRM", oCM:"oCM", oRF:"oLF", oLF:"oRF", oCF:"oCF", B:"B" };
const PH = 64;   // pitch height in units (for mirroring: y -> PH - y)
// Shirt numbers (evens on our right, odds on our left) and role names used in kid-facing text.
const NUM = { GK: "1", RB: "2", LB: "3", RCB: "4", LCB: "5", CM: "6", LCM: "7", RCM: "8", ST: "9" };
const ROLE_NAME = { GK: "keeper", RB: "right back", LB: "left back", RCB: "right centre back", LCB: "left centre back", CM: "centre mid", LCM: "left mid", RCM: "right mid", ST: "striker" };
const ID_NUM_RE = /\b(GK|RB|LB|RCB|LCB|CM|LCM|RCM|ST)\b/g;
const numberize = (s) => typeof s === "string" ? s.replace(ID_NUM_RE, (m) => NUM[m]) : s;
function numberizeInst(inst) {
  const o = Object.assign({}, inst, { title: numberize(inst.title), situation: numberize(inst.situation), kidLine: numberize(inst.kidLine), principle: numberize(inst.principle),
    choices: inst.choices.map((c) => Object.assign({}, c, { label: numberize(c.label), why: numberize(c.why), pro: numberize(c.pro), con: numberize(c.con),
      outcome: c.outcome ? Object.assign({}, c.outcome, { result: numberize(c.outcome.result) }) : c.outcome })) });
  return o;
}

const smoothstep = (t) => t * t * (3 - 2 * t);
// Piecewise keyframe interpolation with smoothstep between neighbours. Works for ms keys or normalized keys.
function sampleTrack(track, t) {
  if (!track || track.length === 0) return null;
  if (t <= track[0][0]) return [track[0][1], track[0][2]];
  for (let a = 1; a < track.length; a++) {
    if (t <= track[a][0]) {
      const [t0, x0, y0] = track[a - 1], [t1, x1, y1] = track[a];
      const g = t1 === t0 ? 1 : (t - t0) / (t1 - t0);
      const s = smoothstep(Math.max(0, Math.min(1, g)));
      return [x0 + (x1 - x0) * s, y0 + (y1 - y0) * s];
    }
  }
  const e = track[track.length - 1];
  return [e[1], e[2]];
}
function trailPoints(track, from, to, n = 14) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const p = sampleTrack(track, from + (to - from) * (i / n)); if (p) pts.push(p); }
  return pts;
}
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const prefersReduced = () => !!window.__forceReduced || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

// rAF animation 0→1 over durMs. Returns a cancel function. Honors prefers-reduced-motion by jumping to the end.
function animate(durMs, onFrame, onDone) {
  let raf = null, start = null, done = false, cancelled = false;
  if (prefersReduced() || durMs <= 0) {
    onFrame(1);
    const to = setTimeout(() => { if (!cancelled) { done = true; onDone && onDone(); } }, 350);
    return () => { cancelled = true; clearTimeout(to); };
  }
  const step = (now) => {
    if (cancelled) return;
    if (start === null) start = now;
    const p = Math.min(1, (now - start) / durMs);
    onFrame(p);
    if (p < 1) raf = requestAnimationFrame(step);
    else if (!done) { done = true; onDone && onDone(); }
  };
  raf = requestAnimationFrame(step);
  return () => { cancelled = true; if (raf) cancelAnimationFrame(raf); };

// ---------- text mirroring ----------

      if (!c.zone && !c.arrow) bad(inst.id, "choice " + c.id + " needs a zone or an arrow");
      if (!c.outcome || (!c.outcome.play && !c.outcome.tracks)) bad(inst.id, "choice " + c.id + " outcome needs play:true or tracks");

    if (/\{\{/.test([inst.title, inst.situation, inst.kidLine, inst.principle].join(" "))) bad(inst.id, "unresolved {{token}} in text");

      activeStepper = stepper(pages);
      openSheet(el("div", { class: "card" }, activeStepper.root));
    }
    function runTimeout() {
      phase = "timeout"; pitch.setOverlays(null); renderCtrl("timeout");
      openSheet(el("div", { class: "card" }, ratingChip("slow"), el("div", { class: "eyebrow" }, "No decision is a decision"),

        el("div", { class: "btnRow" }, el("button", { class: "btn primary", onClick: runIntro }, "Try again"))));
    }
    if (self.devNoRecord) runIntro(); else showBrief();
    return col;
  },
};
