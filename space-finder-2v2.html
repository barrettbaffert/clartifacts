 meetings aren't.",pro:"Doubling works when the ball is pinned on a sideline.",con:"In open field it just empties the space behind you.",outcome:{dur:2300,result:"Played through!",tone:"bad",tracks:{Y:[[0,33,32],[.4,31,35],[1,33,34]],T:[[0,26,40],[.5,30,37],[1,33,36]],O1:[[0,46,34],[.4,41,33.5],[.6,40,33],[.8,34,28],[1,26,26]],B:[[0,39,33],[.5,40,33],[.7,34,28],[.9,24,26],[1,12,29]],O2:[[0,56,44],[.6,46,42],[1,38,40]]}}}]}]},{id:"set4",name:"Cover & Balance",tag:"DEFENSE \xB7 SECOND DEFENDER",desc:"Your partner is pressing the ball. Your position saves the day \u2014 or loses it.",scenarios:[{id:"s4-1",title:"Never Flat",situation:"Your partner is pressing the ball carrier. The other attacker waits wide. Where do you stand?",intro:{dur:1400,tracks:{T:[[0,34,28],[1,38,27]],O1:[[0,48,26],[1,44,26]],B:[[0,46,26],[1,42,26]],O2:[[0,52,44],[1,48,44]],Y:[[0,34,40],[1,36,38]]}},choices:[{id:"a",kind:"zone",label:"Drop to 45\xB0 cover",zone:{at:[32,33],r:4.5},rating:"great",principle:"Cover: behind and between",why:"Your partner got beaten \u2014 and it didn't matter, because you were waiting at 45\xB0: close enough to step in, deep enough to see everything.",pro:"Cover position is one spot that answers two threats.",con:"Keep talking \u2014 'I've got cover!' lets your partner press harder.",outcome:{dur:2500,result:"Ball won",tone:"good",tracks:{Y:[[0,36,38],[.3,32,33],[.5,32,33],[.7,35,29],[1,37,29]],O1:[[0,44,26],[.45,38,25],[.6,36,27],[.8,37,29],[1,38,30]],B:[[0,42,26],[.45,37,26],[.6,35,28],[.72,36,29],[1,38,29]],T:[[0,38,27],[.45,39,25],[.7,41,27],[1,40,28]],O2:[[0,48,44],[.6,44,42],[1,42,41]]}}},{id:"b",kind:"zone",label:"Step up level with your partner",zone:{at:[39,32],r:4.5},rating:"risky",principle:"Flat pair = one pass beats two",why:"Level with your partner means one line. A single pass through the gap erased both of you at once.",pro:"Stepping up can squeeze \u2014 when there's a keeper behind you. There isn't.",con:"The second defender's first rule: NEVER flat.",outcome:{dur:2500,result:"They score!",tone:"bad",tracks:{O1:[[0,44,26],[.4,43,27],[1,44,30]],B:[[0,42,26],[.35,42,27],[.55,30,36],[.75,20,37],[.9,10,34],[1,5,32]],O2:[[0,48,44],[.35,40,42],[.6,26,38],[.8,16,36],[1,10,34]],Y:[[0,36,38],[.35,39,33],[.6,34,37],[1,26,37]],T:[[0,38,27],[.6,34,30],[1,28,32]]}}},{id:"c",kind:"zone",label:"Mark the far attacker tight",zone:{at:[47,42],r:4.5},rating:"good",principle:"Marking removes him \u2014 and you",why:"You deleted the pass, and the ball carrier had to go alone \u2014 but when he beat your partner, nobody was home. This time the shot missed.",pro:"Tight marking takes an attacker out of the game.",con:"It also takes YOU out of covering. 45\xB0 does both jobs at once.",outcome:{dur:2500,result:"Shot \u2014 wide",tone:"neutral",tracks:{Y:[[0,36,38],[.4,45,42],[1,47,43]],O1:[[0,44,26],[.45,37,25],[.7,26,27],[.9,16,29],[1,14,29]],B:[[0,42,26],[.45,36,25],[.7,25,27],[.85,15,29],[1,5,24]],T:[[0,38,27],[.45,39,25],[.7,30,27],[1,20,28]],O2:[[0,48,44],[1,49,43]]}}}]},{id:"s4-2",title:"Partner's Beaten",situation:"The ball carrier just skipped past your partner and is heading for goal. You're marking the other attacker. What now?",intro:{dur:1300,tracks:{O1:[[0,46,29],[.6,40,29],[1,38,30]],B:[[0,44,29],[.6,38,29.5],[1,36,30]],T:[[0,42,26],[.5,42,28],[1,44,28]],Y:[[0,30,42],[1,30,40]],O2:[[0,26,46],[1,28,44]]}},choices:[{id:"a",kind:"run",label:"Leave your man \u2014 press the ball",arrow:{from:[30,40],to:[32,31]},rating:"great",principle:"The nearest danger is the ball",why:"The ball scores goals \u2014 men don't. You stepped to the ball, he had to slow down, and that bought your partner time to sprint back and take your man.",pro:"Pressure and cover are jobs that swap owners in a blink. You swapped.",con:"Angle your press to push him away from goal while help arrives.",outcome:{dur:2500,result:"Danger defused",tone:"good",tracks:{Y:[[0,30,40],[.35,32,33],[.5,33,31],[1,34,31]],O1:[[0,38,30],[.45,36,30],[.7,38,32],[1,40,33]],B:[         @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .root {
          min-height: 100vh; background: ${T.night};
          background-image: radial-gradient(1200px 600px at 50% -10%, #14273F 0%, ${T.night} 60%);
          color: ${T.text}; font-family: 'Nunito', sans-serif;
          display: flex; justify-content: center; padding: 16px;
        }
        .home { max-width: 980px; width: 100%; }
        .masthead { text-align: center; padding: 22px 12px 8px; }
        .kick { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 3px;
          font-size: 13px; color: ${T.dim}; font-weight: 700; }
        h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
          font-size: clamp(38px, 7vw, 60px); margin: 6px 0 8px; letter-spacing: 1px; }
        h1 .accent { color: ${T.tele}; }
        .sub { color: ${T.dim}; max-width: 640px; margin: 0 auto; font-size: 15px; line-height: 1.55; }
        .setGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
          gap: 14px; margin-top: 24px; }
        .setCard { text-align: left; background: ${T.panel}; border: 1px solid ${T.panelEdge};
          border-radius: 16px; padding: 16px; color: ${T.text}; cursor: pointer;
          transition: transform .12s ease, border-color .12s ease; }
        .setCard:hover { transform: translateY(-2px); border-color: ${T.tele}; }
        .setTag { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 2px; font-size: 11.5px;
          color: ${T.tele}; font-weight: 700; }
        .setName { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800;
          margin: 4px 0 6px; }
        .setDesc { color: ${T.dim}; font-size: 13.5px; line-height: 1.45; min-height: 40px; }
        .setFoot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .star { color: rgba(255,255,255,0.18); font-size: 20px; margin-right: 2px; }
        .star.on { color: ${T.tele}; }
        .star.lg { font-size: 40px; margin: 0 4px; }
        .bigStars { margin: 8px 0 12px; }
        .doneCt { font-size: 12px; color: ${T.dim}; }

        .playRow { display: flex; gap: 16px; width: 100%; max-width: 1200px; align-items: stretch; }
        .pitchCol { flex: 1 1 auto; min-width: 0; align-self: center; display: flex;
          flex-direction: column; gap: 10px; width: 100%; }
        .pitchWrap { position: relative; width: 100%; aspect-ratio: 100 / 64;
          border-radius: 16px; overflow: hidden; border: 1px solid ${T.panelEdge};
          box-shadow: 0 12px 40px rgba(0,0,0,0.45); }
        @supports not (aspect-ratio: 1) {
          .pitchWrap { height: 0; padding-bottom: 64%; }
          .pitchWrap > svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        }
